# Include this file inside the existing HTTPS server block.
auth_basic "Team log catalog";
auth_basic_user_file /etc/nginx/log-catalog.htpasswd;

# Flask authenticates this one endpoint with the upload-only Bearer key.
location = /api/ingest {
    auth_basic off;
    proxy_pass http://127.0.0.1:18765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_cache off;
}
